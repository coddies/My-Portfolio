<script>
(function(){
  const scene = document.querySelector('.nl-iso-scene');
  const platforms = document.getElementById('nlIsoPlatforms');
  if(!scene || !platforms) return;

  scene.addEventListener('mousemove', function(e){
    if(window.innerWidth < 600) return;
    const rect = scene.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const dx = (e.clientX - cx) / (rect.width/2);
    const dy = (e.clientY - cy) / (rect.height/2);
    platforms.style.transform =
      `rotateX(${30 - dy*10}deg) rotateY(${-15 + dx*10}deg) rotateZ(5deg)`;
  });

  scene.addEventListener('mouseleave', function(){
    platforms.style.transition = 'transform 0.8s ease';
    platforms.style.transform = 'rotateX(30deg) rotateY(-15deg) rotateZ(5deg)';
    setTimeout(()=>{ platforms.style.transition = 'transform 0.5s ease'; }, 800);
  });
})();
</script>
