/* === BOMBPROOF RESPONSIVE SOLAR SYSTEM === */
.solar-universe {
    position: relative;
    width: 100%;
    height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: visible; 
    background: none !important;
}

.solar-system-scale {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 800px;
    height: 800px;
    transform: translate(-50%, -50%) scale(1);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease;
    transform-origin: center center;
}

.core-sun {
    position: absolute; 
    width: 90px; 
    height: 90px; 
    border-radius: 50%;
    background: radial-gradient(circle, #00E5FF 0%, transparent 80%);
    box-shadow: 0 0 50px rgba(0, 229, 255, 0.8), 0 0 100px rgba(139, 92, 246, 0.4);
    display: flex; 
    align-items: center; 
    justify-content: center; 
    z-index: 20;
    border: 1px solid rgba(0, 229, 255, 0.3);
}

@keyframes orbit { 100% { transform: rotate(360deg); } }
@keyframes anti-orbit { 100% { transform: rotate(-360deg); } }

.orbit-ring {
    position: absolute; 
    border: 1px dashed rgba(0, 229, 255, 0.12); 
    border-radius: 50%;
    pointer-events: none;
}
.orbit-wrapper {
    position: absolute; 
    border-radius: 50%; 
    pointer-events: none;
}
.planet {
    position: absolute; 
    width: 48px; 
    height: 48px; 
    border-radius: 50%;
    pointer-events: auto; 
    cursor: crosshair;
    display: flex;
    align-items: center;
    justify-content: center;
}
.planet-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(6, 11, 20, 0.95); 
    border: 1px solid rgba(0, 229, 255, 0.4);
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
}

.orbit-wrapper:hover, 
.orbit-wrapper:hover .planet { 
    animation-play-state: paused !important; 

}

.planet:hover .planet-inner { 
    transform: scale(1.6); 
    z-index: 100; 
    border-color: #00E5FF; 
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.7); 
    background: rgba(0, 229, 255, 0.2); 
}
.planet-text {
    position: absolute; 
    top: -30px; 
    white-space: nowrap;
    font-family: 'Space Grotesk', monospace; 
    font-size: 8px; 
    color: rgba(255,255,255,0.9);
    transition: all 0.3s ease; 
    text-transform: uppercase; 
    letter-spacing: 0.15em;
    pointer-events: none;
}

/* Planet Positions */
.p-0   { top: -24px; left: calc(50% - 24px); }
.p-180 { bottom: -24px; left: calc(50% - 24px); }
.p-120 { top: 75%; left: 93%; }
.p-240 { top: 75%; left: -2%; }

/* MEDIA QUERIES - PREMIUM MOBILE ENLARGEMENT (NOTE/EDGE) */
@media (max-width: 1200px) {
    .solar-system-scale { transform: translate(-50%, -50%) scale(0.8); }
}
@media (max-width: 992px) {

}
@media (max-width: 768px) {

    }

}
@media (max-width: 600px) {

@media (max-width: 480px) {

@media (max-width: 380px) {

                function typeEffect(element, text, speed, callback) {
                    let i = 0;
                    element.textContent = "";
                    const interval = setInterval(() => {
                        element.textContent += text[i];
                        i++;
                        if (i >= text.length) {
                            clearInterval(interval);
                            if (callback) callback();
                        }
                    }, speed);
                }

                // Initial type
