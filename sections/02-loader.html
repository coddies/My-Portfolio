<!-- Body with initial lock to prevent layout shift during loader -->
<body style="overflow:hidden; height:100vh; position:fixed; width:100%; background:#060B14;">

    <!-- ══ FORCED INITIAL LOADER ══ -->
    <div id="mb-loader">
        <div id="mb-panel-left"></div>
        <div id="mb-panel-right"></div>
        <div id="mb-loader-content">
            <div id="mb-name">Muhammad Burhan</div>
            <div id="mb-subtitle">AI &amp; Data Science</div>
            <div id="mb-rocket-wrap">
                <svg width="50" height="90" viewBox="0 0 50 90" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="25" cy="35" rx="12" ry="22" fill="white"/>
                    <polygon points="25,2 13,20 37,20" fill="white"/>
                    <circle cx="25" cy="30" r="6" fill="#00D4FF" opacity="0.8"/>
                    <circle cx="25" cy="30" r="4" fill="#050610"/>
                    <polygon points="13,50 4,70 13,60" fill="#00D4FF"/>
                    <polygon points="37,50 46,70 37,60" fill="#00D4FF"/>
                    <ellipse cx="25" cy="65" rx="8" ry="14" fill="#FF6B00" id="mb-fl-o"/>
                    <ellipse cx="25" cy="63" rx="5" ry="9" fill="#B829FF" id="mb-fl-i"/>
                    <ellipse cx="25" cy="61" rx="3" ry="6" fill="white"/>
                </svg>
            </div>
        </div>
        <div id="mb-loader-stars" style="position:absolute;inset:0;pointer-events:none;z-index:1;"></div>
    </div>

    <!-- ══ PAGE TRANSITION FLASH OVERLAY ══ -->
    <div id="transition-flash" style="position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;
         background:radial-gradient(circle at center, rgba(124,58,237,0.15), transparent);
         transition:opacity 0.15s ease;"></div>

    <!-- ══ CUSTOM CURSOR ELEMENTS ══ -->
    <div class="cursor-dot-wrap">
        <div class="cursor-dot"></div>
    </div>
    <div class="cursor-ring-wrap">
        <div class="cursor-ring-outer"></div>
        <div class="cursor-ring-inner"></div>
    </div>

    <!-- ══ PARTICLE CANVAS BACKGROUND ══ -->
    <canvas id="particles-canvas"></canvas>
