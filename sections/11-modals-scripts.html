<!-- Cert Modal -->
<div class="cert-modal" id="certModal">
    <div class="modal-content">
        <div class="modal-close" id="modalClose">&times;</div>
        <img src="" alt="Certificate" id="modalImg">
    </div>
</div>

<!-- Case Study Modal -->
<div class="cs-modal" id="csModal">
    <div class="cs-modal-inner">
        <div class="cs-modal-close" id="csModalClose">&times;</div>
        <div class="cs-modal-scroll">
            <div id="csModalDynamicContent"></div>
            <div class="cs-modal-grid">
                <div class="cs-modal-side" style="width: 100%;">

                    <div class="cs-comments-section">
                        <h3>Discussion</h3>
                        <div class="cs-comments-list" id="csCommentsList"></div>
                        <div class="cs-comment-form">
                            <input type="text" id="csCommentName" class="cs-comment-name" placeholder="Your Name">
                            <textarea id="csCommentText" class="cs-comment-textarea" placeholder="Share your thoughts..."></textarea>
                            <style>
                                #csCommentSubmit {
                                    align-self: flex-end;
                                    background: linear-gradient(90deg, var(--purple), var(--cyan));
                                    color: white; border: none; border-radius: 99px;
                                    padding: 11px 28px; font-size: 14px; font-weight: 700;
                                    cursor: pointer; font-family: inherit;
                                    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                                }
                                #csCommentSubmit:hover {
                                    transform: translateY(-10px) rotate(1deg) scale(1.05);
                                    background: rgba(255,255,255,0.05);
                                    border: 1px solid var(--purple);
                                    color: var(--purple);
                                    box-shadow: 0 15px 45px rgba(124, 58, 237, 0.45);
                                    backdrop-filter: blur(8px);
                                }
                            </style>
                            <button id="csCommentSubmit">Post Comment</button>
                        </div>


                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- Nav Instruction Popup -->
    <div id="navPopup" class="nav-popup">
        <span class="nav-popup-icon" id="navPopupIcon">🖱️</span>
        <span class="nav-popup-text" id="navPopupText">Click arrows or use keyboard to explore</span>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
