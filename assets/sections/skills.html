<section id="card-3" class="card state-below">

<div class="card-inner im-root">

  <!-- ── STATUS TERMINAL HEADER (Top Left) ── -->
  <div class="im-header">
    <h2 id="im-header-title" class="im-header-title"></h2>
    <p id="im-header-sub" class="im-header-sub"></p>
  </div>

  <!-- ── MAIN 2-COLUMN VIEWPORT ── -->
  <div class="im-layout">

    <!-- LEFT COLUMN: Floating Sci-Fi Category Boxes (Sans-Serif, Zero-Gravity Float, Generous Gap) -->
    <div class="im-cats" id="imCatsContainer"></div>

    <!-- RIGHT STAGE: Clean Deep Space, Crisp Tilted Trajectory Line & Sub-Orbit System -->
    <div class="im-stage" id="imStage">

      <!-- Background: Floating Dust Particles Canvas -->
      <canvas id="imCanvas" class="im-canvas"></canvas>

      <!-- Single Crisp Thin Tilted Trajectory Line (Extended Full Top to Bottom) -->
      <svg class="im-line-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none" style="overflow: visible;" aria-hidden="true">
        <defs>
          <filter id="imLaserGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Ambient Wide Cyan Glow along the line (Running far past edges from y=-300 to y=1300) -->
        <line x1="806" y1="-300" x2="294" y2="1300"
              stroke="#00F0FF" stroke-width="6" opacity="0.3" filter="url(#imLaserGlow)"/>

        <!-- Crisp Solid Core Trajectory Line (Completely edge to edge across entire screen) -->
        <line x1="806" y1="-300" x2="294" y2="1300"
              stroke="#00F0FF" stroke-width="1.8" opacity="0.95"/>

        <!-- Bright White Laser Thread for High Contrast & Sharpness -->
        <line x1="806" y1="-300" x2="294" y2="1300"
              stroke="#FFFFFF" stroke-width="0.75" opacity="0.85"/>

        <!-- Center Focal Alignment Markers on the Tilted Line (x=550, y=500) -->
        <circle cx="550" cy="500" r="5" fill="#00F0FF" opacity="0.9" filter="url(#imLaserGlow)"/>
        <circle cx="550" cy="500" r="2.5" fill="#FFFFFF"/>
        <line x1="480" y1="500" x2="620" y2="500" stroke="#00F0FF" stroke-width="0.8" opacity="0.5" stroke-dasharray="2 4"/>

        <!-- Measurement Tick Markings along the continuous trajectory line -->
        <line x1="684" y1="60"  x2="696" y2="60"  stroke="#00F0FF" stroke-width="1.2" opacity="0.75"/>
        <line x1="640" y1="200" x2="652" y2="200" stroke="#00F0FF" stroke-width="1.2" opacity="0.75"/>
        <line x1="592" y1="350" x2="604" y2="350" stroke="#00F0FF" stroke-width="1.2" opacity="0.75"/>
        <line x1="496" y1="650" x2="508" y2="650" stroke="#00F0FF" stroke-width="1.2" opacity="0.75"/>
        <line x1="448" y1="800" x2="460" y2="800" stroke="#00F0FF" stroke-width="1.2" opacity="0.75"/>
        <line x1="404" y1="940" x2="416" y2="940" stroke="#00F0FF" stroke-width="1.2" opacity="0.75"/>
      </svg>

      <!-- Viewport: Strictly ONE active category node visible at a time -->
      <div class="im-node-viewport" id="imNodeViewport"></div>

    </div><!-- /.im-stage -->
  </div><!-- /.im-layout -->
</div><!-- /.im-root -->

<script>
/* ══════════════════════════════════════════════════════════════════
   INTELLIGENCE_MATRIX v3.2 — ZERO-GRAVITY FLOATING SCI-FI SYSTEM
   SANS-SERIF TYPOGRAPHY | SKILL DETAIL POPOVER | STABLE HOVER TEXT
   ══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ── 1. EXACT 30 SKILLS DATA WITH CONCISE 1-SENTENCE DETAILS ── */
  var CATEGORIES = [
    {
      id: 0,
      indexStr: '01',
      title: 'GENERATIVE & AGENTIC AI',
      shortTitle: 'GEN AI',
      icon: 'psychology',
      skills: [
        { name: 'AGENTIC AI',   icon: 'psychology',   desc: 'Autonomous multi-step agents & reasoning workflows' },
        { name: 'GEN AI',       icon: 'auto_awesome', desc: 'Generative models, multi-modal pipelines & video synthesis' },
        { name: 'RAG SYSTEMS',  icon: 'hub',          desc: 'Knowledge retrieval-augmented generation & vector search' },
        { name: 'LLMS',         icon: 'memory',       desc: 'Large language model integration, inference & workflows' },
        { name: 'PROMPT ENG',   icon: 'edit_note',    desc: 'Structured few-shot prompts & output reliability engineering' },
        { name: 'AMAZON NOVA',  icon: 'star',         desc: 'Nova foundation models for automated AI video pipelines' },
        { name: 'AWS BEDROCK',  icon: 'cloud',        desc: 'Enterprise managed Gen AI on secure AWS cloud stack' }
      ]
    },
    {
      id: 1,
      indexStr: '02',
      title: 'ML & DATA SCIENCE',
      shortTitle: 'ML & DATA',
      icon: 'schema',
      skills: [
        { name: 'PYTHON',           icon: 'code',       desc: 'Core primary language — ML, data science & backend APIs', isCore: true },
        { name: 'MACHINE LEARNING', icon: 'schema',     desc: 'Applied algorithms, predictive models & feature pipelines' },
        { name: 'NLP',              icon: 'translate',  desc: 'Tokenization, transformers, embeddings & semantic parsing' },
        { name: 'DATA ANALYSIS',    icon: 'analytics',  desc: 'Exploratory data analysis, statistical metrics & insights' },
        { name: 'PROBLEM SOLVING',  icon: 'lightbulb',  desc: 'Algorithmic logic, edge-case analysis & optimization' }
      ]
    },
    {
      id: 2,
      indexStr: '03',
      title: 'WORKFLOW & AI AUTOMATION',
      shortTitle: 'AUTOMATION',
      icon: 'account_tree',
      skills: [
        { name: 'N8N',           icon: 'account_tree', desc: 'Visual workflow automations, webhooks & API integrations' },
        { name: 'AI TOOLS',      icon: 'build',        desc: 'Cursor, Groq API, automation frameworks & dev tooling' },
        { name: 'API',           icon: 'bolt',         desc: 'High-speed LLM inference pipelines & RESTful service design' },
        { name: 'SYSTEM DESIGN', icon: 'architecture', desc: 'Scalable architecture, modular structure & clean patterns' },
        { name: 'VIBE CODING',   icon: 'auto_fix',     desc: 'AI-assisted rapid prototyping & creative software building' }
      ]
    },
    {
      id: 3,
      indexStr: '04',
      title: 'FULL-STACK WEB ENG.',
      shortTitle: 'FULL-STACK',
      icon: 'code_blocks',
      skills: [
        { name: 'REACT',      icon: 'code_blocks', desc: 'Component-driven interactive web applications & interfaces' },
        { name: 'JAVASCRIPT', icon: 'javascript',  desc: 'Modern ES6+ vanilla scripting & dynamic UI architectures' },
        { name: 'FASTAPI',    icon: 'bolt',        desc: 'Production asynchronous Python backends, CRUD & auth' },
        { name: 'SQL / DB',   icon: 'database',    desc: 'Relational databases, PostgreSQL schema modeling & queries' },
        { name: 'TAILWIND',   icon: 'palette',     desc: 'Utility-first modern responsive layouts & design systems' },
        { name: 'HTML5',      icon: 'html',        desc: 'Semantic markup, accessibility & clean document structure' },
        { name: 'CSS3',       icon: 'css',         desc: 'Hardware-accelerated 3D transforms, keyframes & styling' },
        { name: 'VITE',       icon: 'speed',       desc: 'Next-gen lightning fast modern frontend tooling & bundling' }
      ]
    },
    {
      id: 4,
      indexStr: '05',
      title: 'CLOUD, DEVOPS & MEDIA',
      shortTitle: 'CLOUD/MEDIA',
      icon: 'cloud_queue',
      skills: [
        { name: 'AWS CLOUD',       icon: 'cloud_queue',       desc: 'Cloud infrastructure, serverless functions & deployment' },
        { name: 'GIT / GITHUB',    icon: 'commit',            desc: 'Version control, collaborative workflows & open source' },
        { name: 'VERCEL',          icon: 'rocket_launch',     desc: 'Edge network deployments & serverless cloud functions' },
        { name: 'VIDEO EDITING',   icon: 'movie',             desc: 'Creative media production, pacing & motion graphics' },
        { name: 'CONTENT CREATOR', icon: 'video_camera_front', desc: 'Tech dev education & tutorials on TikTok (@devmburhan)' }
      ]
    }
  ];

  /* ── 2. STATE (SLOW SMOOTH PLANETARY SPEED) ── */
  var currentIndex = 0;
  var isTransitioning = false;
  var currentRadius = 162;
  var targetRadius = 162;
  var rotationSpeed = 0.00017;
  var currentSpeed = rotationSpeed;
  var targetSpeed = rotationSpeed;
  var currentAngle = 0;
  var isHoveredBoost = false;
  var isMoonHovered = false;
  var lastTimestamp = null;
  var orbitRAF = null;

  /* ── 3. TYPEWRITER HEADER ── */
  (function initHeader() {
    var titleEl = document.getElementById('im-header-title');
    var subEl = document.getElementById('im-header-sub');
    if (!titleEl || !subEl) return;

    var titleText = 'Intelligence_Matrix';
    var subText = '// AI, Full-Stack & Automation Stack';
    var tIdx = 0, sIdx = 0;

    titleEl.textContent = '';
    subEl.textContent = '';

    var tTimer = setInterval(function () {
      titleEl.textContent += titleText[tIdx++];
      if (tIdx >= titleText.length) {
        clearInterval(tTimer);
        var sTimer = setInterval(function () {
          subEl.textContent += subText[sIdx++];
          if (sIdx >= subText.length) clearInterval(sTimer);
        }, 30);
      }
    }, 50);
  })();

  /* ── 4. RENDER SCI-FI FLOATING CATEGORY BOXES ── */
  var catsContainer = document.getElementById('imCatsContainer');

  CATEGORIES.forEach(function (cat) {
    var floatWrap = document.createElement('div');
    floatWrap.className = 'im-cat-float';

    var wrap = document.createElement('div');
    wrap.className = 'im-cat-wrap' + (cat.id === currentIndex ? ' active' : '');
    wrap.dataset.catId = cat.id;

    wrap.innerHTML =
      '<div class="im-cat-inner">' +
        '<!-- Chamfered Corner Ticks -->' +
        '<div class="im-corner im-c-tl"></div>' +
        '<div class="im-corner im-c-tr"></div>' +
        '<div class="im-corner im-c-bl"></div>' +
        '<div class="im-corner im-c-br"></div>' +
        '<!-- Sci-Fi Striped Hash Markings -->' +
        '<div class="im-hash im-h-top"></div>' +
        '<div class="im-hash im-h-bot"></div>' +
        '<!-- Content -->' +
        '<div class="im-cat-left">' +
          '<span class="im-cat-bracket">[</span>' +
          '<span class="im-cat-idx">' + cat.indexStr + '</span>' +
          '<span class="im-cat-bracket">]</span>' +
          '<span class="im-cat-name">' + cat.title + '</span>' +
        '</div>' +
        '<span class="material-symbols-outlined im-cat-icon">' + cat.icon + '</span>' +
      '</div>';

    // Click handler: locked open state
    wrap.addEventListener('click', function () {
      if (cat.id !== currentIndex && !isTransitioning) {
        selectCategory(cat.id);
      }
    });

    // Hover handler: gentle acceleration & sub-orbit expansion pulse
    wrap.addEventListener('mouseenter', function () {
      isHoveredBoost = true;
      targetSpeed = rotationSpeed * 1.8;
      targetRadius = 178;
    });

    wrap.addEventListener('mouseleave', function () {
      isHoveredBoost = false;
      if (!isMoonHovered) {
        targetSpeed = rotationSpeed;
        targetRadius = 162;
      }
    });

    floatWrap.appendChild(wrap);
    catsContainer.appendChild(floatWrap);
  });

  /* ── 5. SINGLE ACTIVE CATEGORY NODE DOM BUILDER (With Detail Popovers) ── */
  var viewport = document.getElementById('imNodeViewport');
  var currentNodeEl = null;

  function createCategoryNode(cat) {
    var node = document.createElement('div');
    node.className = 'im-single-node';
    node.dataset.catId = cat.id;

    // Radius calculation based on skill count to ensure zero overlaps
    var baseR = window.innerWidth <= 768 ? 120 : (cat.skills.length >= 7 ? 174 : 160);
    targetRadius = baseR;
    currentRadius = baseR;

    var ringDiam = baseR * 2;

    var moonsHtml = '';
    cat.skills.forEach(function (sk, i) {
      var isPython = sk.isCore ? ' im-python-core' : '';
      moonsHtml +=
        '<div class="im-moon-badge' + isPython + '" data-skill-idx="' + i + '">' +
          '<span class="material-symbols-outlined">' + sk.icon + '</span>' +
          '<span class="im-moon-text">' + sk.name + '</span>' +
          '<!-- Floating Detail Popover -->' +
          '<div class="im-skill-popover">' +
            '<div class="im-pop-head">' +
              '<span class="material-symbols-outlined im-pop-icon">' + sk.icon + '</span>' +
              '<span class="im-pop-title">' + sk.name + '</span>' +
            '</div>' +
            '<p class="im-pop-desc">' + sk.desc + '</p>' +
          '</div>' +
        '</div>';
    });

    node.innerHTML =
      '<!-- Circular Sub-Orbit System -->' +
      '<div class="im-suborbit-container" id="imSuborbitRing">' +
        '<div class="im-orbit-guide-ring" style="width:' + ringDiam + 'px; height:' + ringDiam + 'px;"></div>' +
        '<div class="im-orbit-inner-ring" style="width:' + (ringDiam * 0.55) + 'px; height:' + (ringDiam * 0.55) + 'px;"></div>' +
        moonsHtml +
      '</div>' +
      '<!-- Center Category Planet Node -->' +
      '<div class="im-planet-core-wrap" id="imCenterPlanet">' +
        '<div class="im-planet-aura"></div>' +
        '<div class="im-planet-core">' +
          '<span class="material-symbols-outlined">' + cat.icon + '</span>' +
          '<span class="im-planet-core-label">' + cat.shortTitle + '</span>' +
        '</div>' +
      '</div>';

    // Hover listeners on the center planet
    var planetWrap = node.querySelector('#imCenterPlanet');
    planetWrap.addEventListener('mouseenter', function () {
      isHoveredBoost = true;
      targetSpeed = rotationSpeed * 1.9;
      targetRadius = (window.innerWidth <= 768 ? 130 : 182);
    });
    planetWrap.addEventListener('mouseleave', function () {
      isHoveredBoost = false;
      targetSpeed = rotationSpeed;
      targetRadius = (window.innerWidth <= 768 ? 120 : (cat.skills.length >= 7 ? 174 : 160));
    });

    // Hover listeners on each skill moon badge (pauses spin & reveals detail popover)
    var moonBadges = node.querySelectorAll('.im-moon-badge');
    moonBadges.forEach(function (moon) {
      moon.addEventListener('mouseenter', function () {
        isMoonHovered = true;
        targetSpeed = 0; // Pause rotation while reading detail popover
      });
      moon.addEventListener('mouseleave', function () {
        isMoonHovered = false;
        targetSpeed = isHoveredBoost ? (rotationSpeed * 1.8) : rotationSpeed;
      });
    });

    return node;
  }

  // Initial mount: only Category 01 is mounted
  currentNodeEl = createCategoryNode(CATEGORIES[0]);
  viewport.appendChild(currentNodeEl);

  /* ── 6. STEP-BY-STEP VERTICAL 1-STEP SCROLL TRANSITION ALONG TILTED LINE ── */
  function selectCategory(nextId) {
    if (nextId === currentIndex || isTransitioning) return;
    isTransitioning = true;

    var isMovingDown = nextId > currentIndex;
    var prevId = currentIndex;
    currentIndex = nextId;

    // Update Left Category Boxes
    var wraps = catsContainer.querySelectorAll('.im-cat-wrap');
    wraps.forEach(function (w) {
      var id = parseInt(w.dataset.catId, 10);
      w.classList.toggle('active', id === nextId);
    });

    // Create incoming single category node
    var nextCat = CATEGORIES[nextId];
    var nextNodeEl = createCategoryNode(nextCat);

    // Position along the tilted line outside the view
    if (isMovingDown) {
      nextNodeEl.classList.add('entering-from-bottom');
    } else {
      nextNodeEl.classList.add('entering-from-top');
    }
    viewport.appendChild(nextNodeEl);

    // Animate out the old node along the tilted line
    if (currentNodeEl) {
      var oldNode = currentNodeEl;
      if (isMovingDown) {
        oldNode.classList.add('exiting-to-top');
      } else {
        oldNode.classList.add('exiting-to-bottom');
      }
      setTimeout(function () {
        if (oldNode.parentNode) oldNode.parentNode.removeChild(oldNode);
      }, 650);
    }

    // Force repaint
    void nextNodeEl.offsetWidth;

    // Animate in to the center focal point
    requestAnimationFrame(function () {
      nextNodeEl.classList.remove('entering-from-bottom', 'entering-from-top');
      currentNodeEl = nextNodeEl;
    });

    setTimeout(function () {
      isTransitioning = false;
    }, 700);
  }

  /* ── 7. SMOOTH CONTINUOUS ORBITAL ROTATION LOOP (requestAnimationFrame) ── */
  function updateOrbit(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    var delta = timestamp - lastTimestamp;
    lastTimestamp = timestamp;

    if (delta > 100) delta = 16;

    // Smooth speed & radius physics lerp
    currentSpeed += (targetSpeed - currentSpeed) * 0.06;
    currentRadius += (targetRadius - currentRadius) * 0.06;

    currentAngle += currentSpeed * delta;

    if (currentNodeEl) {
      var moonBadges = currentNodeEl.querySelectorAll('.im-moon-badge');
      var count = moonBadges.length;

      // Update guide ring dimension
      var guideRing = currentNodeEl.querySelector('.im-orbit-guide-ring');
      if (guideRing) {
        var d = Math.round(currentRadius * 2);
        guideRing.style.width = d + 'px';
        guideRing.style.height = d + 'px';
      }

      // Position each moon badge along the sub-orbit ring
      // Crucial: Moons use translate(x, y) ONLY so icons & labels STAY UPRIGHT AT ALL TIMES!
      for (var i = 0; i < count; i++) {
        var moon = moonBadges[i];
        var angle = currentAngle + (i * (Math.PI * 2 / count));
        var x = Math.cos(angle) * currentRadius;
        var y = Math.sin(angle) * currentRadius;

        moon.style.transform = 'translate(calc(-50% + ' + x.toFixed(1) + 'px), calc(-50% + ' + y.toFixed(1) + 'px))';
      }
    }

    orbitRAF = requestAnimationFrame(updateOrbit);
  }

  orbitRAF = requestAnimationFrame(updateOrbit);

  /* ── 8. FLOATING COSMIC DUST PARTICLES CANVAS ── */
  (function initCanvas() {
    var canvas = document.getElementById('imCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var W, H, particles = [];

    function resize() {
      W = canvas.width = canvas.offsetWidth || 800;
      H = canvas.height = canvas.offsetHeight || 600;
    }
    resize();
    window.addEventListener('resize', resize);

    for (var k = 0; k < 45; k++) {
      particles.push({
        x: Math.random() * (W || 800),
        y: Math.random() * (H || 600),
        r: Math.random() * 1.2 + 0.3,
        vx: (Math.random() - 0.5) * 0.18,
        vy: (Math.random() - 0.5) * 0.18,
        alpha: Math.random() * 0.5 + 0.18
      });
    }

    function renderParticles() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 240, 255, ' + p.alpha + ')';
        ctx.fill();
      }
      requestAnimationFrame(renderParticles);
    }
    renderParticles();
  })();

  /* ── 9. KEYBOARD STEP NAVIGATION (1 to 5 & Arrows) ── */
  document.addEventListener('keydown', function (e) {
    var card = document.getElementById('card-3');
    if (!card || !card.classList.contains('state-active')) return;

    var num = parseInt(e.key, 10);
    if (num >= 1 && num <= 5) {
      selectCategory(num - 1);
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      if (currentIndex < CATEGORIES.length - 1) {
        selectCategory(currentIndex + 1);
      }
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      if (currentIndex > 0) {
        selectCategory(currentIndex - 1);
      }
    }
  });

})();
</script>

</section>
